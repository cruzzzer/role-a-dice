<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guess The Dice Number</title>

<style>

/* =====================================
   RESET
===================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =====================================
   BODY + YOUR BACKGROUND IMAGE
===================================== */

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: "Segoe UI", Arial, sans-serif;

    color: white;

    overflow-x: hidden;

    background-image:
        linear-gradient(
            rgba(0, 5, 18, 0.25),
            rgba(0, 5, 18, 0.35)
        ),
        url("background.jpg");

    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}


/* =====================================
   BLUE BACKGROUND GLOW
===================================== */

body::after {
    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            rgba(0, 110, 255, 0.12),
            transparent 60%
        );
}


/* =====================================
   GAME CARD
===================================== */

.game-card {
    width: 705px;

    min-height: 960px;

    padding: 28px 52px 32px;

    margin: 20px;

    border-radius: 34px;

    background:
        linear-gradient(
            180deg,
            rgba(2, 18, 43, 0.92),
            rgba(1, 10, 27, 0.95)
        );

    border: 2px solid #078cff;

    box-shadow:
        0 0 10px rgba(0, 140, 255, 0.9),
        0 0 30px rgba(0, 100, 255, 0.45),
        0 0 70px rgba(0, 100, 255, 0.2),
        inset 0 0 35px rgba(0, 100, 255, 0.08);

    position: relative;

    z-index: 2;

    backdrop-filter: blur(2px);
}


/* =====================================
   TOP NEON LINE
===================================== */

.game-card::before {
    content: "";

    position: absolute;

    top: 0;

    left: 8%;

    width: 84%;

    height: 2px;

    background: #19a7ff;

    box-shadow:
        0 0 10px #19a7ff,
        0 0 25px #19a7ff,
        0 0 45px #19a7ff;
}


/* =====================================
   TITLE
===================================== */

.title {
    text-align: center;

    margin-top: 2px;

    margin-bottom: 8px;

    line-height: 1;
}


/* =====================================
   TOP DICE ICON
===================================== */

.dice-icon {
    display: block;

    font-size: 60px;

    margin-bottom: 5px;

    filter:
        drop-shadow(0 0 8px #078cff)
        drop-shadow(0 0 20px #078cff);

    animation:
        floatingDice 2s ease-in-out infinite;
}


/* Floating animation */

@keyframes floatingDice {

    0% {
        transform: translateY(0) rotate(0deg);
    }

    50% {
        transform: translateY(-8px) rotate(5deg);
    }

    100% {
        transform: translateY(0) rotate(0deg);
    }
}


/* =====================================
   MAIN TITLE
===================================== */

.title h1 {
    font-size: 51px;

    font-weight: 900;

    letter-spacing: 1px;

    color: white;

    text-shadow:
        0 3px 5px rgba(0,0,0,0.6),
        0 0 15px rgba(255,255,255,0.15);
}


/* Blue title */

.title h1 span {
    display: block;

    color: #078fff;

    font-size: 57px;

    margin-top: 4px;

    text-shadow:
        0 0 5px #008cff,
        0 0 15px #008cff,
        0 0 30px #008cff,
        0 0 50px rgba(0,140,255,0.7);
}


/* =====================================
   SUBTITLE
===================================== */

.subtitle {
    text-align: center;

    color: #c4ddff;

    font-size: 17px;

    margin-top: 17px;

    margin-bottom: 28px;
}


/* =====================================
   SELECT TITLE
===================================== */

.select-title {
    font-size: 21px;

    font-weight: bold;

    margin-bottom: 13px;
}


/* =====================================
   NUMBER BUTTONS
===================================== */

.number-buttons {
    display: flex;

    justify-content: space-between;

    gap: 14px;
}


.number-buttons button {

    flex: 1;

    height: 70px;

    border-radius: 13px;

    border: 2px solid #087fff;

    background:
        linear-gradient(
            180deg,
            rgba(7, 47, 96, 0.72),
            rgba(3, 25, 61, 0.85)
        );

    color: white;

    font-size: 30px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.25s;

    box-shadow:
        inset 0 0 10px rgba(0,130,255,0.1);
}


.number-buttons button:hover {

    transform: translateY(-3px);

    border-color: #20aaff;

    box-shadow:
        0 0 12px #078dff,
        0 0 25px rgba(0,140,255,0.35);
}


.number-buttons button.selected {

    background:
        linear-gradient(
            135deg,
            #0da4ff,
            #0873ee
        );

    border-color: #27b2ff;

    box-shadow:
        0 0 10px #00a2ff,
        0 0 25px rgba(0,145,255,0.8),
        inset 0 0 15px rgba(255,255,255,0.15);

    transform: translateY(-3px);
}


/* =====================================
   DICE AREA
===================================== */

.dice-area {

    height: 265px;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;
}


/* =====================================
   DICE BLUE GLOW
===================================== */

.dice-glow {

    position: absolute;

    width: 250px;

    height: 195px;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(0,132,255,0.38),
            rgba(0,80,255,0.12),
            transparent 70%
        );

    filter: blur(6px);

    animation:
        glowPulse 2s ease-in-out infinite;
}


@keyframes glowPulse {

    0% {
        transform: scale(0.95);
        opacity: 0.7;
    }

    50% {
        transform: scale(1.08);
        opacity: 1;
    }

    100% {
        transform: scale(0.95);
        opacity: 0.7;
    }
}


/* =====================================
   DICE
===================================== */

.dice {

    width: 175px;

    height: 175px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #e8edf2
        );

    border-radius: 29px;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    grid-template-rows:
        repeat(3, 1fr);

    padding: 25px;

    position: relative;

    z-index: 2;

    box-shadow:

        0 0 20px rgba(0,144,255,0.9),

        0 0 50px rgba(0,100,255,0.35),

        0 18px 30px rgba(0,0,0,0.45);
}


/* =====================================
   DICE DOT
===================================== */

.dot {

    width: 26px;

    height: 26px;

    background:
        radial-gradient(
            circle at 35% 30%,
            #26384b,
            #020b18
        );

    border-radius: 50%;

    align-self: center;

    justify-self: center;

    box-shadow:
        inset 2px 2px 3px rgba(255,255,255,0.1);
}


/* =====================================
   DICE POSITIONS
===================================== */

.top-left {
    grid-column: 1;
    grid-row: 1;
}

.top-right {
    grid-column: 3;
    grid-row: 1;
}

.middle-left {
    grid-column: 1;
    grid-row: 2;
}

.center {
    grid-column: 2;
    grid-row: 2;
}

.middle-right {
    grid-column: 3;
    grid-row: 2;
}

.bottom-left {
    grid-column: 1;
    grid-row: 3;
}

.bottom-right {
    grid-column: 3;
    grid-row: 3;
}


/* =====================================
   DICE ROLL ANIMATION
===================================== */

.rolling {
    animation:
        diceRoll 0.8s ease-in-out;
}


@keyframes diceRoll {

    0% {
        transform:
            rotate(0deg)
            scale(1);
    }

    20% {
        transform:
            rotate(70deg)
            scale(1.1);
    }

    40% {
        transform:
            rotate(150deg)
            scale(0.9);
    }

    60% {
        transform:
            rotate(230deg)
            scale(1.1);
    }

    80% {
        transform:
            rotate(310deg)
            scale(0.95);
    }

    100% {
        transform:
            rotate(360deg)
            scale(1);
    }
}


/* =====================================
   RESULT
===================================== */

.result {

    height: 62px;

    border: 1.5px solid #087fff;

    border-radius: 12px;

    background:
        rgba(3,30,70,0.78);

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 21px;

    font-weight: bold;

    margin-bottom: 15px;

    box-shadow:
        0 0 8px rgba(0,130,255,0.15);

    transition: 0.3s;
}


.result .number {

    color: #20a5ff;

    font-size: 26px;

    margin-left: 7px;
}


.result.win {

    color: #42ff91;

    border-color: #42ff91;

    box-shadow:
        0 0 15px rgba(66,255,145,0.3);
}


.result.lose {

    color: #ff6262;

    border-color: #ff6262;

    box-shadow:
        0 0 15px rgba(255,70,70,0.2);
}


/* =====================================
   ROLL BUTTON
===================================== */

.roll-button {

    width: 100%;

    height: 72px;

    border: none;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #0da9ff,
            #086eea
        );

    color: white;

    font-size: 27px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:

        0 5px 18px
        rgba(0,132,255,0.45),

        inset 0 1px 2px
        rgba(255,255,255,0.25);

    transition: 0.25s;
}


.roll-button:hover {

    transform: translateY(-3px);

    box-shadow:

        0 8px 28px
        rgba(0,140,255,0.7),

        0 0 20px
        rgba(0,140,255,0.4);
}


.roll-button:active {

    transform: scale(0.98);
}


.roll-button:disabled {

    opacity: 0.6;

    cursor: not-allowed;
}


/* =====================================
   SCORE
===================================== */

.score-box {

    width: 225px;

    height: 57px;

    margin: 22px auto 8px;

    border: 2px solid #559dff;

    border-radius: 30px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    background:
        rgba(2,25,60,0.6);

    font-size: 21px;

    font-weight: bold;

    box-shadow:
        0 0 8px rgba(0,120,255,0.15);
}


.trophy {
    font-size: 24px;
}


.score-number {

    color: #ffd52f;

    font-size: 27px;
}


/* =====================================
   RESET
===================================== */

.reset-button {

    display: block;

    margin: 12px auto 0;

    padding: 10px 25px;

    border-radius: 25px;

    border: 2px solid #087fff;

    background:
        rgba(3,30,65,0.75);

    color: #c9e4ff;

    font-size: 16px;

    cursor: pointer;

    transition: 0.25s;
}


.reset-button:hover {

    background: #087fff;

    color: white;

    box-shadow:
        0 0 15px rgba(0,132,255,0.6);
}


/* =====================================
   MOBILE
===================================== */

@media (max-width: 760px) {

    body {

        padding: 10px;

        align-items: flex-start;

    }


    .game-card {

        width: 100%;

        min-height: auto;

        margin: 10px 0;

        padding:
            28px 20px 30px;

        border-radius: 25px;

    }


    .title h1 {

        font-size: 36px;

    }


    .title h1 span {

        font-size: 40px;

    }


    .dice-icon {

        font-size: 48px;

    }


    .subtitle {

        font-size: 14px;

        line-height: 1.5;

    }


    .number-buttons {

        gap: 7px;

    }


    .number-buttons button {

        height: 54px;

        font-size: 21px;

    }


    .dice-area {

        height: 220px;

    }


    .dice {

        width: 145px;

        height: 145px;

        padding: 20px;

    }


    .dot {

        width: 21px;

        height: 21px;

    }


    .result {

        font-size: 17px;

    }


    .roll-button {

        height: 62px;

        font-size: 22px;

    }

}

</style>

</head>


<body>


<!-- =====================================
     GAME
===================================== -->

<div class="game-card">


    <!-- TITLE -->

    <div class="title">

        <span class="dice-icon">🎲</span>

        <h1>

            GUESS THE

            <span>DICE NUMBER</span>

        </h1>

    </div>


    <!-- SUBTITLE -->

    <p class="subtitle">

        Choose your number → Roll the dice →
        See if you guessed correctly!

    </p>


    <!-- SELECT -->

    <div class="select-title">

        Select your guess:

    </div>


    <!-- NUMBERS -->

    <div class="number-buttons">

        <button onclick="selectGuess(1)">
            1
        </button>

        <button onclick="selectGuess(2)">
            2
        </button>

        <button onclick="selectGuess(3)">
            3
        </button>

        <button onclick="selectGuess(4)">
            4
        </button>

        <button onclick="selectGuess(5)">
            5
        </button>

        <button onclick="selectGuess(6)">
            6
        </button>

    </div>


    <!-- DICE -->

    <div class="dice-area">

        <div class="dice-glow"></div>

        <div
            class="dice"
            id="dice">
        </div>

    </div>


    <!-- RESULT -->

    <div
        class="result"
        id="result">

        Your guess is:

        <span
            class="number"
            id="guessDisplay">

            -

        </span>

        🎯

    </div>


    <!-- ROLL BUTTON -->

    <button
        class="roll-button"
        id="rollButton"
        onclick="rollDice()">

        🎲 Roll Dice

    </button>


    <!-- SCORE -->

    <div class="score-box">

        <span class="trophy">
            🏆
        </span>

        Score:

        <span
            class="score-number"
            id="score">

            0

        </span>

    </div>


    <!-- RESET -->

    <button
        class="reset-button"
        onclick="resetGame()">

        ↻ &nbsp; Reset Game

    </button>


</div>


<script>

/* =====================================
   GAME VARIABLES
===================================== */

let selectedGuess = null;

let score = 0;


/* =====================================
   ELEMENTS
===================================== */

const dice =
    document.getElementById("dice");

const result =
    document.getElementById("result");

const guessDisplay =
    document.getElementById("guessDisplay");

const rollButton =
    document.getElementById("rollButton");

const scoreDisplay =
    document.getElementById("score");


/* =====================================
   DICE POSITIONS
===================================== */

const dicePositions = {

    1: [
        "center"
    ],

    2: [
        "top-left",
        "bottom-right"
    ],

    3: [
        "top-left",
        "center",
        "bottom-right"
    ],

    4: [
        "top-left",
        "top-right",
        "bottom-left",
        "bottom-right"
    ],

    5: [
        "top-left",
        "top-right",
        "center",
        "bottom-left",
        "bottom-right"
    ],

    6: [
        "top-left",
        "top-right",
        "middle-left",
        "middle-right",
        "bottom-left",
        "bottom-right"
    ]

};


/* =====================================
   CREATE DICE
===================================== */

function createDice(number) {

    dice.innerHTML = "";

    dicePositions[number].forEach(
        position => {

            const dot =
                document.createElement("div");

            dot.className =
                "dot " + position;

            dice.appendChild(dot);

        }
    );

}


/* =====================================
   SELECT GUESS
===================================== */

function selectGuess(number) {

    selectedGuess = number;


    /* Remove previous selection */

    document
        .querySelectorAll(
            ".number-buttons button"
        )
        .forEach(button => {

            button.classList.remove(
                "selected"
            );

        });


    /* Select current button */

    document
        .querySelectorAll(
            ".number-buttons button"
        )[number - 1]
        .classList.add(
            "selected"
        );


    /* Display guess */

    guessDisplay.textContent =
        number;


    result.className =
        "result";

}


/* =====================================
   ROLL DICE
===================================== */

function rollDice() {

    /* Check selection */

    if (selectedGuess === null) {

        result.innerHTML =
            "⚠️ Please select a number first!";

        result.className =
            "result lose";

        return;
    }


    /* Disable button */

    rollButton.disabled = true;


    result.innerHTML =
        "🎲 Rolling...";


    result.className =
        "result";


    /* Restart animation */

    dice.classList.remove(
        "rolling"
    );

    void dice.offsetWidth;

    dice.classList.add(
        "rolling"
    );


    /* Wait for animation */

    setTimeout(() => {


        /* Random number 1-6 */

        const rolledNumber =
            Math.floor(
                Math.random() * 6
            ) + 1;


        /* Display rolled dice */

        createDice(
            rolledNumber
        );


        dice.classList.remove(
            "rolling"
        );


        /* Correct */

        if (
            selectedGuess ===
            rolledNumber
        ) {

            score++;


            result.innerHTML =
                "🎉 CORRECT! You guessed " +
                "<span class='number'>" +
                rolledNumber +
                "</span> 🎯";


            result.className =
                "result win";

        }


        /* Wrong */

        else {

            result.innerHTML =
                "❌ Wrong! The number was " +
                "<span class='number'>" +
                rolledNumber +
                "</span>";


            result.className =
                "result lose";

        }


        /* Update score */

        scoreDisplay.textContent =
            score;


        /* Enable button */

        rollButton.disabled =
            false;


    }, 800);

}


/* =====================================
   RESET GAME
===================================== */

function resetGame() {

    selectedGuess = null;

    score = 0;


    scoreDisplay.textContent =
        "0";


    guessDisplay.textContent =
        "-";


    result.innerHTML =
        "Your guess is: " +
        "<span class='number'>-</span> 🎯";


    result.className =
        "result";


    /* Remove selected button */

    document
        .querySelectorAll(
            ".number-buttons button"
        )
        .forEach(button => {

            button.classList.remove(
                "selected"
            );

        });


    /* Reset dice */

    createDice(1);

}


/* =====================================
   START GAME
===================================== */

createDice(1);

</script>

</body>
</html>
